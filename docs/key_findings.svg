<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
  <title id="title">Key findings</title>
  <desc id="desc">Four key findings about counterfactual memory auditing for long-term agents.</desc>
  <rect width="1120" height="250" rx="18" fill="#FFFFFF"/>

  <rect x="32" y="28" width="516" height="84" rx="12" fill="#FFFFFF" stroke="#1131F5" stroke-width="2"/>
  <text x="62" y="62" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#1131F5">01</text>
  <text x="102" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#1131F5">Accuracy hides memory failure modes</text>
  <text x="102" y="88" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0B0F19">Similar final accuracy can hide different memory behavior.</text>

  <rect x="572" y="28" width="516" height="84" rx="12" fill="#FFFFFF" stroke="#1131F5" stroke-width="2"/>
  <text x="602" y="62" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#1131F5">02</text>
  <text x="642" y="62" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#1131F5">Retrieval is not causal control</text>
  <text x="642" y="88" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0B0F19">The right memory can be retrieved but not dominate the answer.</text>

  <rect x="32" y="138" width="516" height="84" rx="12" fill="#FFFFFF" stroke="#1131F5" stroke-width="2"/>
  <text x="62" y="172" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#1131F5">03</text>
  <text x="102" y="172" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#1131F5">Influence can be concentrated</text>
  <text x="102" y="198" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0B0F19">Some answers depend heavily on a small set of memory writes.</text>

  <rect x="572" y="138" width="516" height="84" rx="12" fill="#FFFFFF" stroke="#1131F5" stroke-width="2"/>
  <text x="602" y="172" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#1131F5">04</text>
  <text x="642" y="172" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#1131F5">Memory design should match the task</text>
  <text x="642" y="198" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#0B0F19">Dialogue memory systems may not fit fine-grained factual QA.</text>
</svg>
